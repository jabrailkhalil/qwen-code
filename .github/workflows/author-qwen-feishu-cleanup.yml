name: Feishu cleanup assertion verification

on:
  push:
    branches: [validation/qwen15518-cleanup-review-nov11]

permissions:
  contents: read

concurrency:
  group: qwen15518-cleanup-review-nov11
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'jabrailkhalil/qwen-code'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      CI: 'true'
      QWEN_SKIP_PREPARE: '1'
      SOURCE_SHA: fbb59cd4a48738181c87a4629a91dc9fae321e74
      SOURCE_TREE: 3b38686e1a6341a9b79ad8f661a4581570637456
      PREVIOUS_HEAD: d181a74ddd43e96d5d2457e64b0be48148549889
      LINT_BASE_SHA: 51c8b617c06f5c4fcb90a720776853dbe8e00eb3
      RESULTS: ${{ github.workspace }}/results
      HARNESS: ${{ github.workspace }}/harness/.github/author-validation
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          sparse-checkout: .github/author-validation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jabrailkhalil/qwen-code
          ref: fbb59cd4a48738181c87a4629a91dc9fae321e74
          path: source
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Verify one-assertion candidate and exact production source
        id: identity
        run: bash "$HARNESS/qwen-feishu-cleanup.sh" identity
      - name: Install the frozen dependency tree
        id: install
        run: bash "$HARNESS/qwen-feishu-cleanup.sh" install
      - name: Omit only the immediate stop cleanup and require its assertion failure
        id: negative
        continue-on-error: true
        run: bash "$HARNESS/qwen-feishu-cleanup.sh" negative
      - name: Run all original Feishu tests after restoring production
        id: full
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: bash "$HARNESS/qwen-feishu-cleanup.sh" full
      - name: Run unchanged two-file ESLint and Prettier checks
        id: style
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: bash "$HARNESS/qwen-feishu-cleanup.sh" style
      - name: Verify source and production blob are restored
        id: clean
        if: ${{ !cancelled() }}
        run: |
          test "$(git hash-object packages/channels/feishu/src/FeishuAdapter.ts)" = 408c1bf4dbf1daa35a8eaa1a9ccade7d929908ce
          git diff --exit-code HEAD -- .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feishu-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/results
          if-no-files-found: error
          retention-days: 14
      - name: Enforce the real positive and mutation outcomes
        if: ${{ !cancelled() }}
        env:
          IDENTITY: ${{ steps.identity.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          NEGATIVE: ${{ steps.negative.outcome }}
          FULL: ${{ steps.full.outcome }}
          STYLE: ${{ steps.style.outcome }}
          CLEAN: ${{ steps.clean.outcome }}
        run: |
          for result in "$IDENTITY" "$INSTALL" "$NEGATIVE" "$FULL" "$STYLE" "$CLEAN"; do
            test "$result" = success
          done
