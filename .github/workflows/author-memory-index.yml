name: Memory index regression validation
on:
  push:
    branches: [ci/memory-index-14877]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QWEN_SKIP_PREPARE: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen install
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Build
        run: npm run build
      - name: Bundle
        run: npm run bundle
      - name: Repository typecheck
        run: npm run typecheck
      - name: Changed-file formatting and lint
        run: |
          corepack pnpm exec prettier --check docs/design/memory-index-omission-notice.md docs/design/memory-index-omission-notice.zh-CN.md docs/users/features/memory.md packages/core/src/memory/index-budget.ts packages/core/src/memory/index-drop-notice.test.ts packages/core/src/memory/indexer.ts packages/core/src/memory/prompt.ts packages/core/src/memory/prompt.test.ts packages/core/src/memory/structured-scan.ts
          corepack pnpm exec eslint packages/core/src/memory/index-budget.ts packages/core/src/memory/index-drop-notice.test.ts packages/core/src/memory/indexer.ts packages/core/src/memory/prompt.ts packages/core/src/memory/prompt.test.ts packages/core/src/memory/structured-scan.ts --max-warnings 0
      - name: Negative control on original production sources
        shell: bash
        run: |
          mkdir -p evidence
          fix_head=$(git rev-parse HEAD)
          source_files=(packages/core/src/memory/index-budget.ts packages/core/src/memory/indexer.ts packages/core/src/memory/prompt.ts packages/core/src/memory/structured-scan.ts)
          restore_sources() {
            git restore --source="$fix_head" -- "${source_files[@]}"
          }
          trap restore_sources EXIT
          git restore --source=6ca2c0bd522de37c865783d7baa616e5ac31ff65 -- "${source_files[@]}"
          cd packages/core
          set +e
          corepack pnpm exec vitest run src/memory/index-drop-notice.test.ts --coverage.enabled=false --maxWorkers=2 --minWorkers=1 --reporter=default --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/baseline.json" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/baseline.log"
          result=${PIPESTATUS[0]}
          set -e
          cd ../..
          test "$result" -ne 0
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const r=JSON.parse(fs.readFileSync('evidence/baseline.json')); assert.equal(r.numTotalTests,10); assert.equal(r.numPassedTests,2); assert.equal(r.numFailedTests,8); assert.equal(r.numRuntimeErrorTestSuites ?? 0,0); console.log('Confirmed: 8 regression assertions fail; 2 controls pass on original sources.');"
          restore_sources
          trap - EXIT
      - name: Full memory suite on fixed sources
        working-directory: packages/core
        run: corepack pnpm exec vitest run src/memory --coverage.enabled=false --maxWorkers=2 --minWorkers=1 --reporter=default --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/fixed-memory.json"
      - name: Bundle smoke without provider credentials
        run: |
          export QWEN_HOME="$(mktemp -d)"
          export QWEN_RUNTIME_DIR="$(mktemp -d)"
          node dist/cli.js --version
          node dist/cli.js --help
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-index-validation
          path: |
            evidence/
            packages/core/junit.xml
          if-no-files-found: warn
