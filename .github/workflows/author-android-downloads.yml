name: Author Android and web download verification

on:
  push:
    branches: [validation/android-downloads-20261015]

permissions:
  contents: read

jobs:
  validate:
    name: 'Build, unit tests, and lint'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 'packages/mobile-shell'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: be539c017cafdf73ff01c6b0597a13697c12dea8
          persist-credentials: false

      - name: 'Record exact tested source'
        working-directory: '.'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/downloads-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/downloads-evidence/source-sha.txt"
          git ls-tree -r HEAD packages/mobile-shell packages/web-shell scripts/check-desktop-isolation.js pnpm-lock.yaml > "$RUNNER_TEMP/downloads-evidence/source-tree.txt"

      - name: 'Set up Java 17'
        uses: 'actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3' # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 'Verify Gradle wrapper'
        shell: 'bash'
        run: |
          expected="$(tr -d '[:space:]' < gradle/wrapper/gradle-wrapper.jar.sha256)"
          actual="$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d ' ' -f1)"
          test "$actual" = "$expected"

      - name: 'Build, run unit tests, and lint'
        shell: 'bash'
        run: './gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug'


      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: android-build-unit-lint
          path: |
            ${{ runner.temp }}/downloads-evidence/
            packages/mobile-shell/app/build/test-results/
            packages/mobile-shell/app/build/reports/lint-results-debug.xml
            packages/mobile-shell/app/build/outputs/apk/debug/app-debug.apk

  device-tests:
    name: 'Keystore and profiles (API ${{ matrix.api-level }})'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            arch: 'x86'
            require-profiles: 'false'
          - api-level: 36
            arch: 'x86_64'
            require-profiles: 'true'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: be539c017cafdf73ff01c6b0597a13697c12dea8
          persist-credentials: false

      - name: 'Record exact tested source'
        working-directory: '.'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/downloads-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/downloads-evidence/source-sha.txt"
          git ls-tree -r HEAD packages/mobile-shell packages/web-shell scripts/check-desktop-isolation.js pnpm-lock.yaml > "$RUNNER_TEMP/downloads-evidence/source-tree.txt"

      - name: 'Set up Java 17'
        uses: 'actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3' # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 'Verify Gradle wrapper'
        working-directory: 'packages/mobile-shell'
        shell: 'bash'
        run: |
          expected="$(tr -d '[:space:]' < gradle/wrapper/gradle-wrapper.jar.sha256)"
          actual="$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d ' ' -f1)"
          test "$actual" = "$expected"

      - name: 'Enable emulator acceleration'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 'Run device tests'
        uses: 'reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c' # v2.34.0
        with:
          api-level: '${{ matrix.api-level }}'
          target: 'google_apis'
          arch: '${{ matrix.arch }}'
          disable-animations: true
          working-directory: 'packages/mobile-shell'
          script: './gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.requireProfileIsolation=${{ matrix.require-profiles }}'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: android-device-${{ matrix.api-level }}
          path: |
            ${{ runner.temp }}/downloads-evidence/
            packages/mobile-shell/app/build/outputs/androidTest-results/
            packages/mobile-shell/app/build/reports/androidTests/

  web:
    name: Linux web download regressions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      QWEN_SKIP_PREPARE: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: be539c017cafdf73ff01c6b0597a13697c12dea8
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - name: Record exact tested source
        run: |
          mkdir -p "$RUNNER_TEMP/downloads-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/downloads-evidence/source-sha.txt"
          git ls-tree -r HEAD packages/mobile-shell packages/web-shell scripts/check-desktop-isolation.js pnpm-lock.yaml > "$RUNNER_TEMP/downloads-evidence/source-tree.txt"
      - name: Frozen installation
        run: corepack pnpm install --frozen-lockfile
      - name: Full workspace build
        run: npm run build
      - name: Affected web regression suites and bundle guards
        working-directory: packages/web-shell
        run: node "$GITHUB_WORKSPACE/node_modules/vitest/vitest.mjs" run client/build-artifact.test.ts client/components/SessionOverviewPanel.test.tsx client/utils/saveBlob.test.ts client/components/artifacts/ArtifactPanel.test.tsx client/components/artifacts/artifactUtils.test.ts client/components/messages/WorkflowExecutionView.test.tsx client/components/sidebar/StandaloneRecents.test.tsx client/components/sidebar/WebShellSidebar.workspace-removal.test.tsx --reporter=json --outputFile="$RUNNER_TEMP/downloads-evidence/web-tests.json"
      - name: Full workspace typecheck
        run: npm run typecheck
      - name: Full workspace lint
        run: npm run lint
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: linux-web-downloads
          path: ${{ runner.temp }}/downloads-evidence/
