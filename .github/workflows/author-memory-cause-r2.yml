name: Reader advice validation October 23
on:
  workflow_dispatch:
  push:
    branches: [ci/memory-reader-advice-oct23]
permissions:
  contents: read
env:
  CI: 'true'
  QWEN_SKIP_PREPARE: '1'
  BASE_SHA: 43d0d50e2cddf363ff3e908ec411bcd513f6c8b6
jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Preserve verification harness
        run: |
          echo "EVIDENCE_DIR=$RUNNER_TEMP/memory-reader-evidence" >> "$GITHUB_ENV"
          cp .github/scripts/reader-controls.mjs "$RUNNER_TEMP/reader-controls.mjs"
          cp .github/scripts/verify-reader-advice.cjs "$RUNNER_TEMP/verify-reader-advice.cjs"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: dbd931b82109dde3892bbaced0440472c85c2191
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify exact source
        run: |
          test "$(git rev-parse HEAD)" = 'dbd931b82109dde3892bbaced0440472c85c2191'
          mkdir -p "$EVIDENCE_DIR"
          git rev-parse HEAD > "$EVIDENCE_DIR/source-head.txt"
          node --version > "$EVIDENCE_DIR/node-version.txt"
      - name: Frozen dependency installation
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Build and bundle
        run: npm run build && npm run bundle
      - name: Repository typecheck
        run: npm run typecheck
      - name: Changed-file formatting and lint
        run: |
          corepack pnpm exec prettier --check packages/core/src/memory/prompt.ts packages/core/src/memory/prompt.test.ts docs/users/features/memory.md
          corepack pnpm exec eslint packages/core/src/memory/prompt.ts packages/core/src/memory/prompt.test.ts --max-warnings 0
      - name: Full memory suite
        working-directory: packages/core
        run: corepack pnpm exec vitest run src/memory --coverage.enabled=false --maxWorkers=2 --minWorkers=1 --reporter=default --reporter=json --outputFile.json="$EVIDENCE_DIR/fixed-memory.json"
      - name: Original source and disabled-length-cause controls
        run: node "$RUNNER_TEMP/reader-controls.mjs"
      - name: Built-module filesystem verification
        run: node "$RUNNER_TEMP/verify-reader-advice.cjs" "$PWD" "$PWD/packages/core/dist/src/memory/prompt.js" built-module "$EVIDENCE_DIR/built-module"
      - name: Built CLI and startup smoke
        run: |
          export QWEN_RUNTIME_DIR="$(mktemp -d)"
          node dist/cli.js --version
          node dist/cli.js --help
          npm run check:serve-fast-path-bundle
      - name: Final clean tracked source
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reader-advice-evidence
          path: ${{ runner.temp }}/memory-reader-evidence/
          if-no-files-found: error
