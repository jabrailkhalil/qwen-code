name: 'Reviewed mobile PR API 26 validation'

on:
  push:
    branches: ['validation/mobile-api26-20261029']

permissions:
  contents: 'read'

jobs:
  device-tests:
    name: 'Reviewed dd8e9451 API 26 device tests'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 25
    steps:
      - name: 'Checkout validation harness'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          path: 'harness'
          persist-credentials: false
      - name: 'Checkout exact reviewed PR source'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          repository: 'QwenLM/qwen-code'
          ref: 'dd8e94513b33848999ac39d324eea6f2dced77aa'
          path: 'source'
          persist-credentials: false
      - name: 'Set up canonical Java 17'
        uses: 'actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3' # v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: 'Verify source, wrapper and remote hardware'
        working-directory: 'source'
        shell: 'bash'
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          test "$(git rev-parse HEAD)" = dd8e94513b33848999ac39d324eea6f2dced77aa
          git diff --exit-code
          { git rev-parse HEAD; java -version 2>&1; uname -a; lscpu; } > ../evidence/source-and-host.txt
          cd packages/mobile-shell
          expected="$(tr -d '[:space:]' < gradle/wrapper/gradle-wrapper.jar.sha256)"
          actual="$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d ' ' -f1)"
          test "$actual" = "$expected"
          sha256sum gradle/wrapper/gradle-wrapper.jar > ../../../evidence/gradle-wrapper.sha256
      - name: 'Enable canonical emulator acceleration'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 'Run the unchanged API 26 lane'
        uses: 'reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c' # v2.34.0
        with:
          api-level: '26'
          target: 'google_apis'
          arch: 'x86'
          disable-animations: true
          working-directory: 'source/packages/mobile-shell'
          script: 'bash "$GITHUB_WORKSPACE/harness/validation/run-api26.sh"'
      - name: 'Collect actual instrumentation results'
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git -C source status --short --untracked-files=no > evidence/tracked-source-status.txt
          if test -d source/packages/mobile-shell/app/build/outputs/androidTest-results; then
            cp -a source/packages/mobile-shell/app/build/outputs/androidTest-results evidence/
          fi
          if test -d source/packages/mobile-shell/app/build/reports/androidTests; then
            cp -a source/packages/mobile-shell/app/build/reports/androidTests evidence/
          fi
          python3 harness/validation/record-device-results.py evidence
      - uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
        if: always()
        with:
          name: 'reviewed-dd8e9451-api26'
          path: 'evidence/'
