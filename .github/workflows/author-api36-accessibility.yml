name: Author clean API 36 accessibility verification

on:
  push:
    branches: [validation/android-accessibility-20261015]

permissions:
  contents: read

jobs:
  device-tests:
    name: 'Clean API 36 accessibility acceptance'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 36
            arch: 'x86_64'
            require-profiles: 'true'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: be539c017cafdf73ff01c6b0597a13697c12dea8
          persist-credentials: false

      - name: 'Record exact source'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/accessibility-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/accessibility-evidence/source-sha.txt"
          git ls-tree -r HEAD packages/mobile-shell > "$RUNNER_TEMP/accessibility-evidence/source-tree.txt"

      - name: 'Set up Java 17'
        uses: 'actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3' # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 'Verify Gradle wrapper'
        working-directory: 'packages/mobile-shell'
        shell: 'bash'
        run: |
          expected="$(tr -d '[:space:]' < gradle/wrapper/gradle-wrapper.jar.sha256)"
          actual="$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d ' ' -f1)"
          test "$actual" = "$expected"

      - name: 'Enable emulator acceleration'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 'Run device tests'
        uses: 'reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c' # v2.34.0
        with:
          api-level: '${{ matrix.api-level }}'
          target: 'google_apis'
          arch: '${{ matrix.arch }}'
          disable-animations: true
          working-directory: 'packages/mobile-shell'
          script: './gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.requireProfileIsolation=${{ matrix.require-profiles }} -Pandroid.testInstrumentationRunnerArguments.class=com.qwen.mobileshell.ProfileAccessibilityDeviceTest'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: android-api36-clean-accessibility
          path: |
            ${{ runner.temp }}/accessibility-evidence/
            packages/mobile-shell/app/build/outputs/androidTest-results/
            packages/mobile-shell/app/build/reports/androidTests/
